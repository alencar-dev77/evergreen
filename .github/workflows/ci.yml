name: CI

# Roda em `macos-latest`, e não no `ubuntu-latest` mais barato: o Evergreen é um
# app macOS-only, os testes de widget desenham telas que só existem aqui e o
# `sqlite3` chega por native assets do próprio sistema.
#
# **Só na promoção**: a suíte roda na PR de
# `validation` para `main`, que é o portão do que fica publicado. A PR de
# feature entra na `validation` sem passar por aqui — a integração é onde se
# confere o conjunto, e um runner de macOS custa dez vezes um de Linux por
# minuto.
on:
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # A mesma versão da máquina que builda o app: o `pubspec.lock` é
          # resolvido nela, e um Flutter mais velho aqui falha no `pub get`.
          flutter-version: '3.47.2'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter analyze

      # Os goldens de conferência visual ficam de fora de propósito: dependem
      # das fontes do sistema e são gerados à mão com
      # `flutter test --run-skipped -t preview --update-goldens`.
      - run: flutter test
