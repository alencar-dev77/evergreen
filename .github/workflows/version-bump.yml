name: Bump version on merge

# A versão sobe quando uma PR é mergeada na `validation`, lendo a label `bump:`
# da própria PR. A `main` herda o número
# pela PR de promoção, e por isso ele é decidido **uma vez**: bumpar dos dois
# lados daria dois números para o mesmo código.
#
# O bump é ato de integração, não de feature: na branch da feature, duas PRs
# abertas ao mesmo tempo subiriam para o mesmo número e conflitariam no
# `pubspec.yaml`, e a versão seria decidida antes de se saber se a PR entra.
# `pull_request_target`, e não `pull_request`: numa PR vinda de fork, o
# `pull_request` recebe um token só de leitura — o `contents: write` abaixo é
# ignorado — e o push do bump falharia no merge de toda contribuição de fora.
# É seguro aqui porque o job nunca roda o código da PR: ele faz checkout da
# `validation` **depois do merge**, que é código que já foi revisado. Não troque
# o `ref: validation` pelo head da PR.
on:
  pull_request_target:
    types: [closed]
    branches: [validation]

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation
          fetch-depth: 0

      - name: Determine bump type from PR label
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q "bump:major"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "bump:minor"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "bump:patch"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      # Sobe SÓ o semver — o build number (`+N`) fica intacto e sobe uma vez por
      # release, pelo `preparar-release.yml`. Se subisse aqui, contaria merges
      # em vez de publicações.
      #
      # Quem calcula, commita, tagueia e envia é o `bump_version` — o mesmo que
      # se roda na mão quando o Actions está fora do ar. Eram duas
      # implementações da mesma regra, e o defeito morava justamente aí: o
      # `cider bump <nível>` zerava o build antes do `cider bump build`, então
      # todo bump saía `+1` e o número não distinguia publicação nenhuma.
      #
      # O título da PR vira a linha do CHANGELOG.md. Ele entra por variável de
      # ambiente, nunca interpolado no `run`: o título é texto de quem abriu a
      # PR — num fork, um desconhecido —, e um `${{ }}` dentro do script seria
      # código dele rodando com o token de escrita.
      - name: Bump version, commit, tag and push
        if: steps.bump.outputs.type != 'none'
        env:
          NIVEL: ${{ steps.bump.outputs.type }}
          TITULO: ${{ github.event.pull_request.title }}
          NUMERO: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/bump_version "$NIVEL" --nota "$TITULO (#$NUMERO)" --push
