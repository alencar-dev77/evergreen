name: Bump version on merge

# A versão sobe quando uma PR é mergeada em `main`, lendo a label `bump:` da
# própria PR. No LuizLaporta e no Portal_LL isso acontece em `validation`, com
# `main` herdando a versão pela PR de promoção; aqui não existe branch de
# integração, então `main` é o alvo direto.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: Install cider
        run: dart pub global activate cider

      - name: Determine bump type from PR label
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q "bump:major"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "bump:minor"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "bump:patch"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and build number
        if: steps.bump.outputs.type != 'none'
        run: |
          dart pub global run cider bump ${{ steps.bump.outputs.type }}
          dart pub global run cider bump build

      - name: Commit, tag and push
        if: steps.bump.outputs.type != 'none'
        run: |
          VERSION=$(dart pub global run cider version)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"
